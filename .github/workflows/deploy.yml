name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The prebuild and postbuild scripts run with bunx.
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Until the custom domain is live the site is served at <user>.github.io/<repo>/. Set the repository
      # variable CUSTOM_DOMAIN (for example www.ayaugc.com) once DNS points at GitHub Pages: the build then
      # serves from the root of that domain and link previews use it.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && / || format(/{0}/, github.event.repository.name) }}
          # Link previews must point at the address this deployment is actually served from.
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format(https://{0}, vars.CUSTOM_DOMAIN) || steps.pages.outputs.base_url }}
          VITE_SUPABASE_URL: https://xsunkngtppzhewdsvkkc.supabase.co
          # Set the VITE_SUPABASE_PUBLISHABLE_KEY repository variable to enable campaign tracking.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-replace-me' }}
      # Fallback app shell for URLs the postbuild script didn't write a page for.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
